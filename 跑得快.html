<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>跑得快 · Pao De Kuai</title>
<style>
  :root{
    --bg:#0a1020;
    --glow-1:#1c2f4f;
    --glow-2:#241c4a;
    --panel:rgba(23,33,54,.78);
    --panel-brd:rgba(148,163,184,.20);
    --text:#e8eefb;
    --muted:#8fa2bb;
    --accent:#38bdf8;
    --accent-2:#f5b942;
    --danger:#f87171;
    --felt-1:#17335c;
    --felt-2:#0a1a33;
    --tile-back-1:#3a5a8f;   /* 牌背（跟主题走） */
    --tile-back-2:#1d3355;
    --sz:1;              /* 牌面尺寸档：小 0.78 / 中 1 / 大 1.24 / 超大 1.5 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;min-height:100vh;padding:12px 16px 14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 620px at 50% -15%, var(--glow-1) 0%, transparent 60%),
      radial-gradient(700px 500px at 90% 110%, var(--glow-2) 0%, transparent 55%),
      var(--bg);
    display:flex;justify-content:center;
  }
  /* 自适应：宽度上限跟着屏幕走，牌桌吃掉纵向剩余空间 */
  .app{
    width:100%;max-width:min(96vw,1500px);
    min-height:calc(100vh - 26px);
    display:flex;flex-direction:column;gap:10px;
  }

  header{text-align:center}
  h1{
    margin:0;font-size:clamp(21px,1.6vw,30px);letter-spacing:.26em;font-weight:700;text-indent:.26em;
    background:linear-gradient(92deg,#fde68a,#f5b942 45%,#a5b4fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin:5px 0 0;font-size:12px;color:var(--muted);letter-spacing:.06em}

  .panel{background:var(--panel);border:1px solid var(--panel-brd);border-radius:14px;
    backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}

  .hud{display:flex;align-items:flex-start;gap:10px 16px;padding:9px 12px;flex-wrap:wrap}
  .hud-item{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--muted)}
  .hud-v{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .hud-v.turn{color:var(--accent)}
  /* 菜单栏分两部分：左边＝牌局设置与战绩；右边＝显示 / 音效 / 操作 */
  .hud-l,.hud-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
  .hud-r{margin-left:auto;justify-content:flex-end;background:rgba(148,163,184,.06);
    border:1px solid var(--panel-brd);border-radius:11px;padding:6px 10px}
  .field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  select{appearance:none;background:var(--panel2);color:var(--text);border:1px solid var(--panel-brd);
    border-radius:9px;padding:6px 24px 6px 9px;font-size:13px;font-family:inherit;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#7c8ea6 50%),linear-gradient(135deg,#7c8ea6 50%,transparent 50%);
    background-position:calc(100% - 13px) 51%,calc(100% - 8px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus{outline:none;border-color:rgba(245,185,66,.6)}

  button{font-family:inherit;font-size:13px;font-weight:600;color:var(--text);
    background:var(--panel2);border:1px solid var(--panel-brd);
    border-radius:9px;padding:7px 14px;cursor:pointer;
    transition:transform .12s ease,filter .12s ease,border-color .12s ease}
  button:hover:not(:disabled){filter:brightness(1.28);border-color:rgba(245,185,66,.55)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.36;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#d99a1f,#a86f0c);border-color:rgba(253,230,138,.55);color:#2a1c00}
  button.sound-off{color:var(--muted)}

  /* ---------- 牌桌 ---------- */
  .table{
    display:grid;
    flex:1 1 auto;min-height:230px;
    grid-template-columns:clamp(92px,7vw,150px) minmax(0,1fr) clamp(92px,7vw,150px);
    grid-template-rows:auto minmax(190px,1fr);
    grid-template-areas:"tl top tr" "left center right";
    gap:9px;
  }
  .seat{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.13);min-height:76px}
  .seat.top{grid-area:top;align-items:center}
  .seat.left{grid-area:left}
  .seat.right{grid-area:right}
  .seat.off{display:none}
  .seat-head{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
  .seat-name{font-weight:700;color:#cbd5e1}
  .seat-count{color:var(--muted);font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:#475569;flex:none;transition:background .2s}
  .dot.on{background:var(--accent);box-shadow:0 0 9px rgba(245,185,66,.9)}
  .seat-play{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-start;min-height:4px}
  .seat-tag{font-size:11px;color:#7f8ea3;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.06)}
  .seat-tag.pass{color:#94a3b8}
  .seat-tag.think{color:var(--accent-2)}

  .center{
    grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    padding:14px;border-radius:14px;min-height:190px;
    background:radial-gradient(circle at 50% 45%, var(--felt-1), var(--felt-2) 78%);
    border:1px solid rgba(0,0,0,.4);
    box-shadow:inset 0 0 44px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  }
  .center-status{font-size:13px;font-weight:600;color:#c8d8cf;letter-spacing:.04em;text-align:center}
  .center-status.mine{color:var(--accent);font-size:15px}
  .table-play{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:52px;align-items:center;
    padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.24);border:1px dashed rgba(255,255,255,.1)}
  .table-play:empty{border-style:dashed}
  .combo-name{font-size:11.5px;color:#9fb8ab;letter-spacing:.08em}

  /* ---------- 牌 ---------- */
  .card{
    width:var(--cw);height:var(--ch);flex:none;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#fffdf8,#f4eee1 70%,#e8e0cd);
    border:1px solid #c6b99f;border-radius:5px;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
    color:#1f2937;line-height:1;overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  /* SVG 牌面铺满整张牌 */
  .card .face{width:100%;height:100%;display:block;flex:none}
  .card.red{color:#c62828}
  /* 牌面尺寸 = 视口自适应 × 用户选的档位（--sz） */
  .card-sm{--cw:calc(clamp(24px,1.72vw,40px) * var(--sz));--ch:calc(clamp(34px,2.45vw,57px) * var(--sz))}
  .card-md{--cw:calc(clamp(31px,2.3vw,54px) * var(--sz));--ch:calc(clamp(44px,3.25vw,76px) * var(--sz))}
  .card-lg{--cw:calc(clamp(42px,3.2vw,76px) * var(--sz));--ch:calc(clamp(60px,4.55vw,108px) * var(--sz))}
  .card.back{background:linear-gradient(150deg,var(--tile-back-1),var(--tile-back-2));border-color:rgba(0,0,0,.35)}
  .card.back::after{content:'';width:58%;height:64%;border-radius:3px;
    border:1.5px solid rgba(255,255,255,.18);
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 3px,transparent 3px 6px)}

  .play-anim{animation:slap .3s cubic-bezier(.2,1.5,.4,1)}
  @keyframes slap{0%{transform:translateY(-22px) scale(1.18);opacity:.25}100%{transform:none;opacity:1}}

  /* ---------- 我的区域 ---------- */
  .mine{display:flex;flex-direction:column;gap:9px;padding:12px}
  .sel-info{font-size:12px;color:var(--muted);min-height:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sel-info b{color:var(--accent)}
  .sel-info .bad{color:var(--danger)}
  .sel-info .ok{color:#6ee7b7}

  /* ---------- 新手教学条（同中国象棋） ---------- */
  .coach{border-radius:12px;border:1px solid rgba(74,222,128,.35);
    background:linear-gradient(180deg,rgba(74,222,128,.10),rgba(74,222,128,.03));padding:11px 12px}
  .coach-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .coach-tag{font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;
    background:rgba(74,222,128,.22);color:#4ade80;border:1px solid rgba(74,222,128,.45);white-space:nowrap}
  .coach-main{font-size:14px;font-weight:700;color:var(--text)}
  .coach-main b{color:#4ade80}
  .coach-why{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:7px}
  .coach-why b{color:#4ade80}
  .coach-why span{color:#fbbf24}
  .coach-warn{font-size:12.5px;line-height:1.7;margin-top:6px;color:#fbbf24}
  .coach-foot{font-size:11px;color:var(--muted);opacity:.8;margin-top:7px;line-height:1.6}
  .hand{display:flex;gap:0;flex-wrap:wrap;align-items:flex-end;
    min-height:calc(var(--ch) + 12px);padding-top:calc(var(--cw) * 0.36)}
  .hand .card{cursor:pointer;margin-right:calc(var(--cw) * -0.22)}
  .hand .card:last-child{margin-right:0}
  .hand .card:hover{transform:translateY(-7px)}
  .hand .card.sel{transform:translateY(-17px);box-shadow:0 6px 12px rgba(0,0,0,.45),0 0 0 2px var(--accent)}
  /* 新手教学推荐的牌：绿色描边 + 呼吸光（跟中国象棋棋盘上的绿圈一个意思） */
  .hand .card.advise{box-shadow:0 0 0 3px #4ade80, 0 0 18px rgba(74,222,128,.75);
    animation:adviseGlow 1.4s ease-in-out infinite}
  .hand .card.advise.sel{box-shadow:0 6px 12px rgba(0,0,0,.45),0 0 0 3px var(--accent),0 0 16px rgba(74,222,128,.7)}
  @keyframes adviseGlow{
    0%,100%{box-shadow:0 0 0 2px rgba(74,222,128,.7), 0 0 10px rgba(74,222,128,.55)}
    50%{box-shadow:0 0 0 5px rgba(74,222,128,1), 0 0 24px rgba(74,222,128,.95)}
  }
  .hand.locked .card{cursor:default}
  .hand.locked .card:hover{transform:none}
  .btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .btns button{min-width:82px;font-size:14px;padding:9px 18px}
  .btns .play{background:linear-gradient(180deg,#d99a1f,#a86f0c);border-color:rgba(253,230,138,.55);color:#2a1c00}
  .btns .play:hover:not(:disabled){filter:brightness(1.12)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(15,23,42,.95);border:1px solid rgba(245,185,66,.45);color:var(--text);
    padding:9px 18px;border-radius:11px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50;max-width:88vw;text-align:center}
  .toast.show{opacity:1}

  .result{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 30px;border-radius:16px;
    background:rgba(30,41,59,.94);border:1px solid rgba(245,185,66,.4);
    box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .25s ease;text-align:center}
  .result-title{font-size:21px;font-weight:800;letter-spacing:.06em}
  .result-title.win{color:#fbbf24}
  .result-title.lose{color:var(--danger)}
  .result-sub{font-size:12px;color:var(--muted)}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

  footer{text-align:center;font-size:11px;color:#5b6b83;line-height:1.85}
  kbd{background:var(--panel2);border:1px solid var(--panel-brd);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;color:#9fb2c9}

  @media (max-width:700px){
    .app{min-height:0}
    .table{grid-template-columns:78px minmax(0,1fr) 78px}
  }

  /* 音量滑块 */
  .volbox{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
  .volbox input[type=range]{
    -webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),rgba(148,163,184,.30));cursor:pointer;outline:none;
  }
  .volbox input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);cursor:pointer;
  }
  .volbox input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer;
  }
  .volbox .vn{font-variant-numeric:tabular-nums;min-width:22px;text-align:right}

  /* 音量滑块 */

  /* ================= 三栏布局（参考中国象棋） ================= */
  .app{max-width:none;width:100%;margin:0 auto;padding:12px 16px 14px;gap:12px}
  main{
    display:grid;
    grid-template-columns:clamp(250px,17vw,330px) minmax(0,1fr) clamp(250px,17vw,330px);
    gap:14px;align-items:stretch;
    grid-template-rows:minmax(0,1fr);
    height:calc(100vh - 132px);min-height:520px;
  }
  .side-col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding-right:3px}
  .side-col::-webkit-scrollbar{width:7px}
  .side-col::-webkit-scrollbar-thumb{background:var(--line,rgba(148,163,184,.35));border-radius:4px}
  .side-col::-webkit-scrollbar-track{background:transparent}
  .board-col{min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0}
  .sec{padding:12px;display:flex;flex-direction:column;gap:10px;flex:none}
  .sec h2{margin:0 0 2px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .sec .field{margin:0}
  .sec .hud-item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
  .sec .hud-item .hud-v{font-size:15px}
  .sec .btns2{display:flex;flex-direction:column;gap:8px}
  .sec .btns2 button{width:100%}
  .sec footer{text-align:left;line-height:1.9}
  /* 中栏变宽后：手牌与按钮居中，牌区收窄一点更像牌桌 */
  .board-col .hand{justify-content:center}
  .board-col .sel-info{justify-content:center;text-align:center}
  .board-col .table-play{max-width:min(100%,1180px);margin:0 auto}
  .board-col .center-status,.board-col .combo-name{text-align:center}
  .board-col .mine{flex:0 0 auto}
  @media (max-width:1180px){
    main{grid-template-columns:1fr;height:auto;min-height:0}
    .side-col{overflow:visible}
    .board-col{min-height:70vh}
  }

/* ===== 专注/全屏模式：藏起标题和两侧面板，中间区域吃满窗口（Shift+F 或点右上角按钮） ===== */
body.focus header,body.focus aside,body.focus .side-col,body.focus main > *:not(.board-col){display:none}
body.focus main{display:block !important;grid-template-columns:minmax(0,1fr) !important;
  height:auto !important;min-height:0 !important;max-height:none !important}
body.focus .app{max-width:none !important;width:100% !important;padding:6px 10px 10px !important;
  height:auto !important;min-height:calc(100vh - 26px)}
body.focus .board-col{min-height:0 !important;width:100% !important}
body.focus canvas{max-width:100% !important;max-height:calc(100vh - 96px) !important}
.focus-fab{position:fixed;top:9px;right:11px;z-index:80;display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  color:#e8eefb;background:rgba(15,23,42,.74);border:1px solid rgba(148,163,184,.32);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:.6;transition:opacity .15s,transform .15s}
.focus-fab:hover{opacity:1;transform:translateY(-1px)}
body.focus .focus-fab{opacity:.92}
</style>
</head>
<body>
<button class="focus-fab" id="focusFab" title="隐藏标题和两侧面板，让中间占满窗口（Shift+F）">⛶ 专注模式</button>
<!-- 扑克牌的纸张纹理 + 油墨凸起，只定义一次所有牌共用 -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true"><defs>
  <pattern id="cardLinen" width="3" height="3" patternUnits="userSpaceOnUse">
    <circle cx="0.8" cy="0.8" r="0.42" fill="#7a6a4e" fill-opacity="0.13"/>
    <circle cx="2.3" cy="2.3" r="0.42" fill="#ffffff" fill-opacity="0.72"/>
  </pattern>
  <filter id="inkEmboss" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feOffset in="SourceAlpha" dx="-0.7" dy="-0.7" result="o1"/>
    <feGaussianBlur in="o1" stdDeviation="0.45" result="b1"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.9" result="c1"/>
    <feComposite in="c1" in2="b1" operator="in" result="s1"/>
    <feOffset in="SourceAlpha" dx="0.7" dy="0.8" result="o2"/>
    <feGaussianBlur in="o2" stdDeviation="0.45" result="b2"/>
    <feFlood flood-color="#5b4a2e" flood-opacity="0.3" result="c2"/>
    <feComposite in="c2" in2="b2" operator="in" result="s2"/>
    <feMerge>
      <feMergeNode in="s2"/>
      <feMergeNode in="s1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs></svg>
<div class="app">

  <header>
    <h1>跑 得 快</h1>
    <p id="deckInfo">48 张牌（无大小王 · 2 只留一张 · 去掉一张 A）· 先出完者胜</p>
  </header>

  <main>
    <div class="side-col left">
      <section class="panel sec">
        <h2>对局设置</h2>
<label class="field">人数
      <select id="mode">
        <option value="3" selected>3 家（我 + 2 AI）</option>
        <option value="4">4 家（我 + 3 AI）</option>
      </select>
    </label>
<label class="field" title="2 一共四张，只留你选的那一张">保留 2
      <select id="keepTwo"></select>
    </label>
<label class="field" title="A 一共四张，去掉你选的那一张">去掉 A
      <select id="dropAce"></select>
    </label>
<label class="field" title="首出必须带这张 3，持这张 3 的人先出">首出 3
      <select id="leadThree"></select>
    </label>
<label class="field">尺寸
      <select id="zoom">
        <option value="s">小</option>
        <option value="m" selected>中</option>
        <option value="l">大</option>
        <option value="xl">超大</option>
      </select>
    </label>
<label class="field">牌面
      <select id="face"></select>
    </label>
<label class="field">主题
      <select id="theme"></select>
    </label>
<label class="field" title="电脑每次出牌前停多久">对手延时
      <select id="aiDelaySel">
        <option value="0">立即</option>
        <option value="1000">1s</option>
        <option value="3000" selected>3s</option>
        <option value="5000">5s</option>
      </select>
    </label>
<label class="field volbox" title="音效音量">音量
        <input type="range" id="volRange" min="0" max="100" step="1" value="70">
        <span class="vn" id="volNum">70</span>
      </label>
      </section>
      <section class="panel sec" id="coachCard">
        <h2>新手教学</h2>
        <div class="coach">
          <div class="coach-head">
            <span class="coach-tag" id="coachTag">推荐</span>
            <span class="coach-main" id="coachMain">发牌中…</span>
          </div>
          <div class="coach-why" id="coachWhy"></div>
          <div class="coach-warn" id="coachWarn"></div>
          <div class="coach-foot" id="coachFoot"></div>
        </div>
        <div class="btns2" style="margin-top:11px">
          <button id="btnCoach" title="新手教学：轮到你时告诉你出哪几张、为什么（快捷键 G）">🎓 教学中</button>
        </div>
      </section>
      <section class="panel sec">
        <h2>音效与操作</h2>
        <div class="btns2">
<button id="restart" class="primary">重新开局</button>
<button id="voice" title="报牌语音开关">🗣 报牌</button>

    快捷键：<kbd>空格</kbd> 出牌 · <kbd>P</kbd> 不要 · <kbd>H</kbd> 提示 · <kbd>G</kbd> 新手教学 · <kbd>R</kbd> 重开 · <kbd>M</kbd> 音效
